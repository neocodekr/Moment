<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Moment 로그인</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2d2430;background:#fff8fb}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}
    main{width:min(420px,100%);padding:36px;border:1px solid #f3dde6;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(146,64,98,.12);text-align:center}
    .mark{display:grid;place-items:center;width:54px;height:54px;margin:auto;border-radius:17px;background:#ea4f83;color:#fff;font-size:30px;font-weight:800}
    h1{margin:18px 0 10px;font-size:25px}
    p{line-height:1.6;color:#786975}
    a{display:inline-block;margin-top:10px;color:#cb3969;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Moment 로그인</h1>
    <p id="callbackStatus" role="status" aria-live="polite">로그인을 완료하고 있습니다…</p>
    <a href="/">Moment로 돌아가기</a>
  </main>
  <script type="module" src="../../assets/auth-callback.js"></script>
</body>
</html>
