<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" />
  <title>Moment 로그인</title>
  <style>
    :root{font-family:"Noto Sans KR",sans-serif;color:#f5f4f2;background:#08090c}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(circle at center,#191a1f,#08090c 70%)}
    main{width:min(420px,100%);padding:36px;border:1px solid #414247;border-radius:24px;background:#202125;box-shadow:0 24px 60px rgba(0,0,0,.36);text-align:center}
    .mark{display:grid;place-items:center;width:54px;height:54px;margin:auto;border-radius:17px;background:#efedeb;color:#17181a;font-size:30px;font-weight:800}
    h1{margin:18px 0 10px;font-size:25px}
    p{line-height:1.6;color:#aaaab0}
    a{display:inline-block;margin-top:10px;color:#e6b1b5;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Moment 로그인</h1>
    <p id="callbackStatus" role="status" aria-live="polite">로그인을 완료하고 있습니다…</p>
    <a href="/">Moment로 돌아가기</a>
  </main>
  <script type="module" src="../../assets/auth-callback.js"></script>
</body>
</html>
